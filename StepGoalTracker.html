<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Step Goal Tracker</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f1f6fb;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        background: white;
        width: 350px;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0px 5px 18px rgba(0, 0, 0, 0.15);
        text-align: center;
    }

    input {
        width: 90%;
        padding: 10px;
        font-size: 16px;
        margin-top: 10px;
        border-radius: 8px;
        border: 1px solid #bbb;
    }

    button {
        width: 95%;
        padding: 12px;
        margin-top: 15px;
        border: none;
        font-size: 16px;
        background: #007bff;
        color: white;
        border-radius: 8px;
        cursor: pointer;
    }

    button:hover {
        background: #0062cc;
    }

    #message {
        font-size: 18px;
        font-weight: bold;
        margin-top: 15px;
    }

    /* Progress Circle */
    .circle {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: conic-gradient(#007bff 0deg, #ddd 0deg);
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 20px auto;
    }

    .inner {
        width: 110px;
        height: 110px;
        background: white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 22px;
        font-weight: bold;
    }
</style>

</head>
<body>

<div class="container">
    <h2>Step Goal Tracker</h2>

    <div class="circle">
        <div class="inner" id="percent">0%</div>
    </div>

    <input type="number" id="steps" placeholder="Enter Steps Walked">
    <button onclick="checkGoal()">Check Progress</button>

    <p id="message"></p>
</div>

<script>
function checkGoal() {
    let steps = Number(document.getElementById("steps").value);

    // Ternary Operator
    let message = steps >= 10000 
                    ? "Goal Achieved 🎉" 
                    : "Keep Going 💪";

    document.getElementById("message").innerText = message;

    // Progress circle: % of 10,000 steps
    let percentage = Math.min((steps / 10000) * 100, 100);  
    let degrees = (percentage / 100) * 360;

    document.querySelector(".circle").style.background =
        `conic-gradient(#007bff ${degrees}deg, #ddd ${degrees}deg)`;

    document.getElementById("percent").innerText = Math.round(percentage) + "%";
}
</script>

</body>
</html>
