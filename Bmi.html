<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            margin: 0;
            padding:0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background:whitesmoke;
            display:flex;
            justify-content:center;
            align-items: center;
            height : 90vh;
        }
        .container{
            width:400px;
            background:lightskyblue;
            border-radius:12px;
            text-align:centre;
        }
        .progress-container {
        width: 100%;
        background: #ddd;
        height: 18px;
        margin-top: 20px;
        border-radius: 10px;
        overflow: hidden;
            }

        .progress-bar {
        height: 100%;
        width: 0%;
        background: #28a745;
        transition: width 0.6s ease-in-out;
        }
         #bmivalue {
        margin-top: 15px;
        font-size: 22px;
        font-weight: bold;
    }

    #category {
        font-size: 18px;
        margin-top: 5px;
    }
     h2 {
        margin-bottom: 20px;
    }
    input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #bbb;
        border-radius: 8px;
        font-size: 16px;
    }
    button:hover {
        background: #005fcc;
    }
    </style>
    <div class="container">
        <h2> BMI CALCULATOR</h2>
        <input type="number" id="weight" placeholder="Enter weight in kgs">
        <input type="number" id="height" placeholder="Enter height in cms">
        <button onclick="calculateBMI()">Calculate BMI</button>
        <div id="bmivalue"></div>
        <div id="category"></div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>
    <script>
        function calculateBMI(){
            let w=Number(document.getElementById("weight").value);
            let h=Number(document.getElementById("height").value);
            let bmi=w/h*h
            document.getElementById("bmivalue").innerHTML="BMI: "+ bmi.toFixed(2)
            let category = "";
            let progressWidth = 0;
            let progressColor = "#28a745";
            if(bmi<18.5){
                category="Underweight";
                progressWidth=25;
                progressColor = "#ffc107";
            }else if(bmi>=18.5 && bmi<25){
                 category = "Normal";
                progressWidth = 50;
                progressColor = "#28a745";
            }else if(bmi>=25 && bmi<30){
                category = "Overweight";
                progressWidth = 75;
                progressColor = "#ff8800";
            }else {
                category = "Obese";
                progressWidth = 100;
                progressColor = "#dc3545";
            }
            document.getElementById("category").innerHTML="Category :"+ category
            let bar = document.getElementById("progress-bar");
            bar.style.width = progressWidth + "%";
            bar.style.background = progressColor;
        }
    </script>
</body>
</html>
