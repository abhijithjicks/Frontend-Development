<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Layout</title>
  <link rel="stylesheet" href="q10.css">
</head>
<body>
  <header>
    <h1>My Website</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Welcome to My Website</h2>
  </section>

  <section class="about">
    <div class="text">
      <h3>About Me</h3>
      <p>I’m a student passionate about AI, coding, and chess.</p>
    </div>
    <img src="about.jpg" alt="About Image">
  </section>

  <section class="services">
    <div class="service">AI Projects</div>
    <div class="service">Data Analytics</div>
    <div class="service">Web Development</div>
  </section>

  <section class="contact">
    <h3>Contact Us</h3>
    <form>
      <input type="text" placeholder="Name" required>
      <input type="email" placeholder="Email" required>
      <button>Submit</button>
    </form>
  </section>

  <footer>© 2025 My Website</footer>
</body>
</html>
